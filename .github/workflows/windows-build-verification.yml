name: Windows build verification

on:
  push:
    branches: [windows-build-verification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build release
        run: cargo build --release --locked -p victory
      - uses: actions/upload-artifact@v4
        with:
          name: victory-windows-x64
          path: |
            target/release/victory.exe
            LICENSE
          if-no-files-found: error
